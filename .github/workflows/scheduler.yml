name: Daily YouTube Shorts Creator

on:
  schedule:
    # Her gün saat 12:00 UTC'de otomatik çalışır
    - cron: '0 6 * * *'
  workflow_dispatch: # Actions sekmesinden manuel "Run workflow" butonu sunar

jobs:
  run-shorts-creator:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Sistem Bağımlılıklarını Kur (FFmpeg, ImageMagick & Fontlar)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          # MoviePy TextClip için ImageMagick okuma/yazma izinlerini düzenle
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read | write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Python Paketlerini Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır ve YouTube Shorts'a Yükle
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python main.py
