name: Run YouTube Shorts Creator

on:
  schedule:
    - cron: '0 6 * * *'  # Her gün otomatik çalışır
  workflow_dispatch:      # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy gtts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests pillow

      - name: Run Script
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
        run: python main.py
