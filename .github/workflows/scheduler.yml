name: Daily AI Shorts Generator

on:
  schedule:
    - cron: '0 6 * * *' # Her gün saat 12:00 UTC'de otomatik çalışır
  workflow_dispatch: # Actions sekmesinden elle tetikleme imkanı sağlar

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # HF kuyruklarında sıra bekleme ihtimaline karşı 3 saatlik güvenli limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python main.py
