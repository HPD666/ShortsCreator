name: AI Shorts Creator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6  * * *'

jobs:
  run-creator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fast System Dependencies Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Timeout "5";' | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99retries
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "moviepy>=2.0.0" imageio-ffmpeg huggingface_hub google-genai google-api-python-client google-auth-oauthlib gradio_client

      - name: Run Main Script
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python main.py
