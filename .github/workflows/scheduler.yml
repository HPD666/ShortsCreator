name: Daily AI Trend Shorts Creator

on:
  schedule:
    # Her gün saat 12:00'de (UTC) otomatik çalışır
    - cron: '0 12 * * *'
  workflow_dispatch: # GitHub üzerinden "Run workflow" butonuyla elle tetikleme imkanı verir

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sistem Bağımlılıklarını Kur (ffmpeg, Fontlar)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python Kütüphanelerini Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kodu Çalıştır ve YouTube Shorts Yükle
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python main.py
