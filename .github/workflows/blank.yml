name: YouTube Otomatik Yukleme

on:
  workflow_dispatch: # Manuel çalıştırma butonu ekler
  schedule:
    - cron: '0 12 * * *' # Her gün saat 12:00'de otomatik çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repodaki kodları çek
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        pip install google-auth-oauthlib google-api-python-client

    - name: Python Kodunu Çalıştır
      env:
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
      run: python main.py
