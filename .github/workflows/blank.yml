name: YouTube Otomatik 3D Trend Yukleme

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00'da çalışır (UTC 06:00)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem Bağımlılıkları (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Python Kütüphaneleri Kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests beautifulsoup4 moviepy pillow numpy librosa soundfile google-genai google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Botu Çalıştır ve YouTube'a Yükle
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
