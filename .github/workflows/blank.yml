name: Shorts AutoPilot

on:
  schedule:
    # Her gün UTC 18:00'de (TSİ 21:00) otomatik çalışır
    - cron: '0 18 * * *'

jobs:
  autopilot:
    runs-on: ubuntu-latest
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

    steps:
      - name: Repo'yu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: FFmpeg Kurulumu
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install gradio_client moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2 requests yt-dlp

      - name: Botu Çalıştır
        run: python main.py

      - name: Çıktıları Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: outputs/
