name: Free 3D Video Bot

on:
  schedule:
    - cron: '0 12 * * *' # Her gün saat 12:00'de otomatik çalışır
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurilumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: FFmpeg Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install gradio_client moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2 requests yt-dlp

      - name: Botu Çalıştır
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python main.py
