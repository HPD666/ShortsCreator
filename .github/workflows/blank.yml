name: 2 Günde Bir Otomatik Shorts Paylaşımı

on:
  schedule:
    # Her 48 saatte bir (2 günde bir) gece 12:00'de otomatik çalışır
    - cron: '0 0 */2 * *'
  workflow_dispatch: # İstediğinde elle tetikleme butonu

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri Yükle
        run: |
          pip install google-genai google-api-python-client google-auth-oauthlib requests
          
      - name: Otomasyonu Çalıştır
        run: python auto_pilot.py
